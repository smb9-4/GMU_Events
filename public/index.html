<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14050a">
  <title>Log in · GM University Events</title>
  <link rel="icon" href="/img/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=6">
</head>

<body>
  <div class="auth-split">
    <section class="auth-stage event-showcase" id="eventShowcase" aria-label="Featured university events">
      <div class="showcase-slides" id="showcaseSlides"></div>
      <div class="showcase-shade"></div>
      <a class="brand showcase-brand" href="/"><img src="/img/logo.jpg" alt="">
        <div class="wordmark"><b>GM University</b><small>Events Management</small></div>
      </a>
      <div class="showcase-content" aria-live="polite">
        <p class="showcase-category" id="showcaseCategory">TEDx & Conferences</p>
        <h1 class="showcase-title" id="showcaseTitle">Ideas worth<br>sharing<span class="x">.</span></h1>
        <p class="showcase-date" id="showcaseDate">GM University Auditorium</p>
        <p class="showcase-description" id="showcaseDescription">Experience inspiring talks, bold ideas and
          unforgettable moments on campus.</p>
      </div>
      <div class="showcase-footer">
        <div class="showcase-dots" id="showcaseDots" aria-label="Choose event slide"></div>
        <div class="showcase-arrows">
          <button class="showcase-arrow" id="showcasePrev" type="button" aria-label="Previous event">&#8592;</button>
          <button class="showcase-arrow" id="showcaseNext" type="button" aria-label="Next event">&#8594;</button>
        </div>
      </div>
    </section>

    <section class="auth-form-wrap">
      <div class="auth-form">
        <h2 id="loginHeading">Welcome back</h2>
        <p class="sub" id="loginSub">Log in with the phone number you signed up with.</p>
        <div id="err" class="form-error hidden" role="alert"></div>
        <form id="loginForm" novalidate>
          <div class="field">
            <label for="identifier" id="idLabel">Phone number</label>
            <input class="input" id="identifier" name="identifier" type="tel" inputmode="numeric" maxlength="14"
              placeholder="10-digit mobile" autocomplete="tel" required>
          </div>
          <div class="field hidden" id="passwordField">
            <label for="password">Password</label>
            <input class="input" id="password" name="password" type="password" autocomplete="current-password">
          </div>
          <button class="btn btn-spot block lg" type="submit" id="loginBtn">Log in</button>
        </form>
        <p class="switch" id="studentSignupLink">New here? <a href="/signup.html">Create a student account</a></p>
        <p class="switch" style="margin-top:8px">
          <button type="button" id="toggleRoleLogin"
            style="background:none;border:0;padding:0;font:inherit;color:#B79743;font-weight:600;cursor:pointer">Admin/Volunteers
            login</button>
        </p>
      </div>
    </section>
  </div>

  <script src="/js/common.js?v=2"></script>
  <script>
    (() => {
      let slides = [
        {
          image: '/img/event-tedx-1.png',
          category: 'TEDx & Conferences',
          title: 'Ideas worth\nsharing.',
          date: 'GM University Auditorium',
          description: 'Experience inspiring talks, bold ideas and unforgettable moments on campus.'
        },
        {
          image: '/img/event-tedx-2.png',
          category: 'TEDx & Conferences',
          title: 'The stage\nis yours.',
          date: 'University Conference Season',
          description: 'A premier platform for speakers, learners and future leaders to exchange perspectives.'
        },
        {
          image: '/img/event-tedx-3.png',
          category: 'Cultural Festivals',
          title: 'Celebrate\ntogether.',
          date: 'Campus Cultural Showcase',
          description: 'Discover music, dance and performances that bring the university community together.'
        },
        {
          image: '/img/event-festival.png',
          category: 'University Events',
          title: 'Beyond the\nclassroom.',
          date: 'Campus Activities',
          description: 'From cultural festivals to student achievements, explore everything happening at GM University.'
        }
      ];

      const showcase = document.getElementById('eventShowcase');
      const slideBox = document.getElementById('showcaseSlides');
      const dotsBox = document.getElementById('showcaseDots');
      const category = document.getElementById('showcaseCategory');
      const title = document.getElementById('showcaseTitle');
      const date = document.getElementById('showcaseDate');
      const description = document.getElementById('showcaseDescription');
      let current = 0;
      let timer;

      function formatSlideTitle(t) {
        return esc(String(t || '').replace(/<br\s*\/?>/gi, '\n')).replace(/\n/g, '<br>');
      }

      function mountSlides(list) {
        if (!Array.isArray(list) || !list.length) return;
        const pinned = list.filter((s) => s.pinned);
        slides = pinned.length ? pinned : list;
        slideBox.innerHTML = '';
        dotsBox.innerHTML = '';
        current = 0;

        slides.forEach((slide, index) => {
          const image = document.createElement('div');
          const hoverCls = `hover-${slide.hoverEffect || 'zoom'}`;
          image.className = `showcase-slide ${hoverCls}${index === 0 ? ' active' : ''}`;
          image.style.backgroundImage = `url("${slide.image}")`;
          image.style.backgroundPosition = slide.position || 'center';
          slideBox.appendChild(image);

          const dot = document.createElement('button');
          dot.type = 'button';
          dot.className = `showcase-dot${index === 0 ? ' active' : ''}`;
          dot.setAttribute('aria-label', `Show ${slide.category} slide ${index + 1}`);
          dot.addEventListener('click', () => show(index));
          dotsBox.appendChild(dot);
        });
        document.querySelector('.showcase-footer').classList.toggle('hidden', slides.length <= 1);
        show(0);
      }

      function show(index) {
        current = (index + slides.length) % slides.length;
        slideBox.querySelectorAll('.showcase-slide').forEach((el, i) => el.classList.toggle('active', i === current));
        dotsBox.querySelectorAll('.showcase-dot').forEach((el, i) => el.classList.toggle('active', i === current));
        const slide = slides[current];
        category.textContent = slide.category || '';
        title.innerHTML = formatSlideTitle(slide.title);
        date.textContent = slide.date || '';
        description.textContent = slide.description || '';
        restart();
      }

      function restart() {
        clearInterval(timer);
        if (slides.length > 1) {
          timer = setInterval(() => show(current + 1), 3000);
        }
      }

      document.getElementById('showcasePrev').addEventListener('click', () => show(current - 1));
      document.getElementById('showcaseNext').addEventListener('click', () => show(current + 1));
      showcase.addEventListener('mouseenter', () => clearInterval(timer));
      showcase.addEventListener('mouseleave', restart);

      mountSlides(slides);
      API.get('/api/auth/showcase').then((data) => {
        if (data?.slides?.length) mountSlides(data.slides);
      }).catch(() => { });
    })();

    const next = new URLSearchParams(location.search).get('next');
    const safeNext = next && next.startsWith('/') && !next.startsWith('//') ? next : null;
    function targetFor(user) {
      if (!safeNext) return homeFor(user.role);
      if (user.role === 'student' && (safeNext.startsWith('/admin') || safeNext.startsWith('/volunteer'))) return homeFor(user.role);
      if (user.role === 'volunteer' && safeNext.startsWith('/admin')) return homeFor(user.role);
      return safeNext;
    }

    API.get('/api/auth/me').then(({ user }) => location.replace(targetFor(user))).catch(() => { });

    let loginMode = 'student';
    const headingEl = document.getElementById('loginHeading');
    const subEl = document.getElementById('loginSub');
    const idLabel = document.getElementById('idLabel');
    const idInput = document.getElementById('identifier');
    const passField = document.getElementById('passwordField');
    const passInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggleRoleLogin');
    const signupLink = document.getElementById('studentSignupLink');

    toggleBtn.addEventListener('click', () => {
      loginMode = loginMode === 'student' ? 'staff' : 'student';
      document.getElementById('err').classList.add('hidden');
      if (loginMode === 'staff') {
        headingEl.textContent = 'Admin & Volunteer';
        subEl.textContent = 'Log in with your email or phone number and password.';
        idLabel.textContent = 'Email or phone number';
        idInput.type = 'text';
        idInput.removeAttribute('inputmode');
        idInput.removeAttribute('maxlength');
        idInput.placeholder = 'Email or 10-digit phone';
        idInput.autocomplete = 'username';
        passField.classList.remove('hidden');
        passInput.required = true;
        signupLink.classList.add('hidden');
        toggleBtn.textContent = 'Student login';
      } else {
        headingEl.textContent = 'Welcome back';
        subEl.textContent = 'Log in with the phone number you signed up with.';
        idLabel.textContent = 'Phone number';
        idInput.type = 'tel';
        idInput.setAttribute('inputmode', 'numeric');
        idInput.setAttribute('maxlength', '14');
        idInput.placeholder = '10-digit mobile';
        idInput.autocomplete = 'tel';
        passField.classList.add('hidden');
        passInput.required = false;
        passInput.value = '';
        signupLink.classList.remove('hidden');
        toggleBtn.textContent = 'Admin/Volunteers login';
      }
      idInput.focus();
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      const btn = document.getElementById('loginBtn');
      err.classList.add('hidden');
      btn.disabled = true; btn.textContent = 'Logging in…';
      try {
        const { user } = await API.post('/api/auth/login', {
          mode: loginMode,
          identifier: idInput.value,
          password: loginMode === 'staff' ? passInput.value : '',
        });
        location.replace(targetFor(user));
      } catch (ex) {
        err.textContent = ex.message; err.classList.remove('hidden');
        btn.disabled = false; btn.textContent = 'Log in';
      }
    });
  </script>
</body>

</html>
