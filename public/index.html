<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14050a">
  <title>Log in · TEDx GM University</title>
  <link rel="icon" href="/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=2">
</head>
<body>
  <div class="auth-split">
    <section class="auth-stage">
      <a class="brand" href="/"><img src="/img/logo.png" alt=""><div class="wordmark"><b>TED<em>x</em> GMU</b><small>GM University · Innovating Minds</small></div></a>
      <div>
        <h1 class="auth-headline">Take your<br>seat<span class="x">.</span></h1>
        <p class="auth-sub">Pick your chair in Hallama Auditorium, get a QR ticket on your phone, and walk straight in on the day.</p>
      </div>
      <div class="mini-hall" id="miniHall" aria-hidden="true"></div>
    </section>

    <section class="auth-form-wrap">
      <div class="auth-form">
        <h2>Welcome back</h2>
        <p class="sub">Log in with the email or phone number you signed up with.</p>
        <div id="err" class="form-error hidden" role="alert"></div>
        <form id="loginForm" novalidate>
          <div class="field">
            <label for="identifier">Email or phone number</label>
            <input class="input" id="identifier" name="identifier" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn-spot block lg" type="submit" id="loginBtn">Log in</button>
        </form>
        <p class="switch">New here? <a href="/signup.html">Create a student account</a></p>
      </div>
    </section>
  </div>

  <script src="/js/common.js?v=2"></script>
  <script src="/js/auth-stage.js?v=2"></script>
  <script>
    const next = new URLSearchParams(location.search).get('next');
    const safeNext = next && next.startsWith('/') && !next.startsWith('//') ? next : null;

    API.get('/api/auth/me').then(({ user }) => location.replace(safeNext || homeFor(user.role))).catch(() => {});

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      const btn = document.getElementById('loginBtn');
      err.classList.add('hidden');
      btn.disabled = true; btn.textContent = 'Logging in…';
      try {
        const { user } = await API.post('/api/auth/login', {
          identifier: e.target.identifier.value,
          password: e.target.password.value,
        });
        location.replace(safeNext || homeFor(user.role));
      } catch (ex) {
        err.textContent = ex.message; err.classList.remove('hidden');
        btn.disabled = false; btn.textContent = 'Log in';
      }
    });
  </script>
</body>
</html>
